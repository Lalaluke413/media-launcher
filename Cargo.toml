[package]
name = "media-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A minimal controller-operated filesystem video launcher"

[dependencies]
eframe = { version = "=0.33.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
gilrs = "=0.11.2"

[dev-dependencies]
tempfile = "3"

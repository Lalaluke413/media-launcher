[package]
name = "media-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A minimal controller-operated filesystem video launcher"

[dependencies]
directories = "6.0.0"
eframe = { version = "=0.33.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
gilrs = "=0.11.2"
libloading = "0.8.9"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3"
toml = "1.1.6"

[dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland"] }

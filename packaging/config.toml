# Media Launcher configuration. Restart the app after editing.
# Paths in this file are relative to this file's directory, unless absolute.
# Bare executable names are searched on PATH. Use literal strings for Windows:
# root = 'C:\Users\You\Videos'
# No root means URL-only mode; a local library is optional.
# root = '/home/you/Videos'
ui_scale = 1.0
listen = '0.0.0.0:8765'

[window]
# Application window; these settings apply to both playback backends.
mode = 'fullscreen' # 'fullscreen', 'windowed', or 'maximized'
size = [1280, 720]  # initial windowed size, in logical pixels
resizable = true
decorations = true

[player]
backend = 'embedded' # 'embedded' or 'external'
# Optional explicit libmpv client API 2 library path:
# libmpv = 'C:\Tools\mpv\mpv-2.dll'
# executable and fullscreen apply only to the external backend.
executable = 'mpv'
fullscreen = true
# Each entry is one mpv option; use --option=value for values.
args = []

[yt_dlp]
# Omit executable to use bundled yt-dlp on Windows, or mpv's system discovery.
# executable = 'yt-dlp'
# Extra plugin search directories; the app's own directory is always included.
plugin_dirs = []
# Uses normal yt-dlp browser[:profile] syntax.
# cookies_from_browser = 'firefox'
# Each entry is one argument. Repeated options are supported.
# args = ['--extractor-args', 'youtube:player_client=default']
args = []
